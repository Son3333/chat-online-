name: Build Windows Desktop App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Pytest Suite
        run: |
          python -m pytest

      - name: Install Frontend dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: Run Frontend Vitest Suite
        working-directory: ./frontend
        run: |
          npm test

      - name: Build React and Electron Main
        working-directory: ./frontend
        run: |
          npm run build
          npm run build:electron

      - name: Package Windows Portable Executable
        working-directory: ./frontend
        run: |
          npx electron-builder --win portable

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Style-Messenger-Windows-x64
          path: frontend/dist-package/*.exe
          if-no-files-found: error
